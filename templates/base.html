<!DOCTYPE html>
<html lang="en" class="h-full scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DevAudit — Verified Talent Intelligence{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            espresso: {
              800: '#3D261C',
              900: '#2A1810',
              950: '#1A0E08',
            },
            brand: {
              orange: '#F95721',
              orangeHover: '#E04815',
              teal: '#059669',
            },
            surface: '#FBFBF9',
          }
        }
      }
    }
  </script>
  <style>
    .bg-blueprint {
      background-color: #FBFBF9;
      background-image: 
        linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
    }
  </style>
</head>
<body class="bg-blueprint text-stone-800 min-h-full flex flex-col font-sans antialiased selection:bg-brand-orange selection:text-white">
  <!-- Minimal Top Nav -->
  <header class="border-b border-stone-200/80 bg-white/70 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="{% url 'core:index' %}" class="flex items-center gap-2">
        <span class="text-xl font-black tracking-tight text-stone-900">DevAudit</span>
        <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-brand-orange/10 text-brand-orange border border-brand-orange/20">v1.0</span>
      </a>
      <div class="flex items-center gap-6 text-xs font-semibold text-stone-500">
        <a href="#how-it-works" class="hover:text-stone-900 transition-colors">How It Works</a>
        <a href="#commercial-roadmap" class="hover:text-stone-900 transition-colors">Roadmap</a>
        <a href="https://github.com/Ezra-Men/DevAudit" target="_blank" class="px-3 py-1.5 rounded-lg bg-stone-900 hover:bg-stone-800 text-white font-medium transition-colors">GitHub Repo</a>
      </div>
    </div>
  </header>

  <!-- Page Content -->
  <main class="flex-grow">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-stone-200/80 bg-white/60 py-8 text-center text-xs text-stone-500">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <span class="font-bold text-stone-700">DevAudit © 2026. Automated Talent Auditing for African Engineers.</span>
      <div class="flex gap-4">
        <span>Privacy</span>
        <span>Terms</span>
        <span>API Docs</span>
      </div>
    </div>
  </footer>
</body>
</html>
